<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Cube with Clouds + Metallic Wings</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEFA; /* sky blue */
    }

    #colorPicker {
      position: absolute;
      display: none;
      z-index: 10;
      border: none;
      background: none;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <input type="color" id="colorPicker" />

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    // ---------- Scene + Camera + Renderer ----------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x87CEFA);
    document.body.appendChild(renderer.domElement);

    // ---------- Cube ----------
    const size = 1.6;
    const radius = 0.2;
    const segments = 16;
    const geometry = new THREE.BoxGeometry(size, size, size, segments, segments, segments);

    const pos = geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let y = pos.getY(i);
      let z = pos.getZ(i);
      const factor = radius / size;
      x -= Math.sign(x) * factor;
      y -= Math.sign(y) * factor;
      z -= Math.sign(z) * factor;
      pos.setXYZ(i, x, y, z);
    }
    geometry.computeVertexNormals();

    const baseColor = new THREE.Color(0xff00ff);
    const vibrantColor = baseColor.clone().offsetHSL(0, 0.15, 0.15);

    const materials = Array.from({ length: 6 }, () =>
      new THREE.MeshStandardMaterial({
        color: vibrantColor.clone(),
        metalness: 0.5,
        roughness: 0.25,
        emissive: 0x220022,
      })
    );

    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    // ---------- Eyeball ----------
    const eyeball = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 })
    );
    const pupil = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.05 })
    );
    pupil.position.z = 0.29;
    eyeball.add(pupil);

    const upperLid = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, 0, Math.PI/2),
      new THREE.MeshStandardMaterial({ color: vibrantColor.clone(), metalness:0.5, roughness:0.25 })
    );
    upperLid.position.y = 0.12;
    eyeball.add(upperLid);

    const lowerLid = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, Math.PI/2, Math.PI/2),
      new THREE.MeshStandardMaterial({ color: vibrantColor.clone(), metalness:0.5, roughness:0.25 })
    );
    lowerLid.position.y = -0.12;
    eyeball.add(lowerLid);

    eyeball.position.z = 0.60;
    cube.add(eyeball);

    // ---------- Metallic Wings ----------
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0xdfe6ea,
      metalness: 0.95,
      roughness: 0.12,
      envMapIntensity: 0.8
    });

    function makeWing(side = 'left') {
      const wing = new THREE.Group();
      const plateCount = 8;
      for (let i = 0; i < plateCount; i++) {
        const w = 0.6 + i * 0.06;
        const h = 0.2 + i * 0.08;
        const thickness = 0.02;
        const geom = new THREE.BoxGeometry(w, thickness, h);
        const mesh = new THREE.Mesh(geom, wingMat);
        mesh.position.set((i * 0.08) - (plateCount * 0.08 * 0.5), 0, - (i * 0.06)); 
        mesh.rotation.y = (side === 'left' ? 0.25 : -0.25) - (i * 0.01);
        mesh.rotation.z = (side === 'left' ? -0.18 : 0.18) + (i * 0.005);
        wing.add(mesh);
      }
      const root = new THREE.Object3D();
      root.add(wing);
      if (side === 'left') {
        root.position.set(- (size/2 + 0.02), 0, 0);
        root.rotation.y = Math.PI / 12;
      } else {
        root.position.set((size/2 + 0.02), 0, 0);
        root.rotation.y = -Math.PI / 12;
      }
      root.scale.set(0.95, 0.95, 0.95);
      return root;
    }

    const leftWing = makeWing('left');
    const rightWing = makeWing('right');
    cube.add(leftWing);
    cube.add(rightWing);

    // ---------- Clouds ----------
    const loader = new THREE.TextureLoader();
    const cloudTextures = [
      loader.load('cloud1.png'),
      loader.load('cloud2.png')
    ];

    const clouds = [];
    for (let i = 0; i < 50; i++) {
      const tex = cloudTextures[i % cloudTextures.length];
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), mat);
      plane.position.set(Math.random() * 60 - 30, Math.random() * 40 - 20, Math.random() * -60 - 10);
      plane.rotation.z = Math.random() * Math.PI * 2;
      plane.userData.speed = 0.01 + Math.random() * 0.015;
      scene.add(plane);
      clouds.push(plane);
    }

    // ---------- Lights ----------
    const pointLight = new THREE.PointLight(0xffffff, 1.3);
    pointLight.position.set(3, 3, 6);
    scene.add(pointLight);
    const fillLight = new THREE.PointLight(0xff88ff, 0.8);
    fillLight.position.set(-3, -2, -5);
    scene.add(fillLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // ---------- Blink + Color Picker ----------
    let blink = 0, blinking = false;
    setInterval(() => blinking = true, 2500);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const colorInput = document.getElementById("colorPicker");
    let activeFaceMaterialIndex = -1;

    function getMaterialIndexFromFaceIndex(geom, faceIndex) {
      if (geom.groups && geom.groups.length) {
        for (let i = 0; i < geom.groups.length; i++) {
          const g = geom.groups[i];
          const triStart = Math.floor(g.start / 3);
          const triCount = Math.floor(g.count / 3);
          if (faceIndex >= triStart && faceIndex < triStart + triCount) {
            return g.materialIndex;
          }
        }
      }
      return Math.floor(faceIndex / 2);
    }

    function onPointerDown(event) {
      if (event.target === colorInput) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(cube, true);
      if (intersects.length) {
        const hit = intersects[0];
        const faceIndex = hit.faceIndex;
        const matIndex = getMaterialIndexFromFaceIndex(cube.geometry, faceIndex);
        activeFaceMaterialIndex = matIndex;
        colorInput.style.left = `${event.clientX - 24}px`;
        colorInput.style.top = `${event.clientY - 20}px`;
        colorInput.style.display = 'block';
        colorInput.click();
      } else {
        colorInput.style.display = 'none';
        activeFaceMaterialIndex = -1;
      }
    }

    function applyColor(e) {
      if (activeFaceMaterialIndex >= 0) {
        const col = new THREE.Color(e.target.value);
        col.offsetHSL(0, 0, 0.12);
        if (materials[activeFaceMaterialIndex]) {
          materials[activeFaceMaterialIndex].color.set(col);
        } else {
          materials.forEach(m => m.color.set(col));
        }
        upperLid.material.color.set(col);
        lowerLid.material.color.set(col);
      }
    }

    colorInput.addEventListener('input', applyColor);
    colorInput.addEventListener('change', applyColor);
    colorInput.addEventListener('pointerdown', ev => ev.stopPropagation());
    window.addEventListener('pointerdown', onPointerDown);

    // ---------- Animate ----------
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.0075;
      cube.rotation.y += 0.01;

      if (blinking) {
        blink += 0.25;
        eyeball.scale.y = Math.abs(Math.cos(blink));
        if (blink > Math.PI) {
          blink = 0;
          blinking = false;
          eyeball.scale.y = 1;
        }
      }

      clouds.forEach(cloud => {
        cloud.position.x += cloud.userData.speed;
        if (cloud.position.x > 35) cloud.position.x = -35;
      });

      renderer.render(scene, camera);
    }
    animate();

    // ---------- Responsive ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
