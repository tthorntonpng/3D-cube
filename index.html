<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Cube with Clouds + Symmetrical Metallic Wings</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEFA;
    }
    #colorPicker {
      position: absolute;
      display: none;
      z-index: 10;
      border: none;
      background: none;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
    /* Bottom text hint */
    #colorHintText {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>
<input type="color" id="colorPicker" />
<div id="colorHintText">Click cube surfaces to change colors</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 4.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x87CEFA);
document.body.appendChild(renderer.domElement);

// ---------- Cube ----------
const size = 1.3;
const radius = 0.2;
const segments = 16;
const geometry = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
geometry.computeVertexNormals();

const baseColor = new THREE.Color(0xff00ff);
const vibrantColor = baseColor.clone().offsetHSL(0, 0.15, 0.15);
const materials = Array.from({ length: 6 }, () =>
  new THREE.MeshStandardMaterial({
    color: vibrantColor.clone(),
    metalness: 0.5,
    roughness: 0.25,
    emissive: 0x220022,
  })
);
const cube = new THREE.Mesh(geometry, materials);
scene.add(cube);

// ---------- Eyeball ----------
const eyeball = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 })
);
const pupil = new THREE.Mesh(
  new THREE.SphereGeometry(0.10, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.05 })
);
pupil.position.z = 0.30;
eyeball.add(pupil);

const upperLid = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ color: vibrantColor.clone(), metalness:0.5, roughness:0.25 })
);
upperLid.position.y = 0.1;
eyeball.add(upperLid);

const lowerLid = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, Math.PI/2, Math.PI/2),
  new THREE.MeshStandardMaterial({ color: vibrantColor.clone(), metalness:0.5, roughness:0.25 })
);
lowerLid.position.y = -0.1;
eyeball.add(lowerLid);

eyeball.position.z = 0.5;
cube.add(eyeball);

// ---------- Wings ----------
const wingMat = new THREE.MeshStandardMaterial({
  color: 0xdfe6ea,
  metalness: 0.95,
  roughness: 0.12,
  envMapIntensity: 0.8
});

function makeWing(side = 'left') {
  const wing = new THREE.Group();
  const plateCount = 8;
  for (let i = 0; i < plateCount; i++) {
    const w = 0.6 + i * 0.06;
    const h = 0.2 + i * 0.08;
    const geom = new THREE.BoxGeometry(w, 0.02, h);
    const mesh = new THREE.Mesh(geom, wingMat);
    mesh.position.set((i * 0.08) - (plateCount * 0.08 * 0.5), 0, - (i * 0.06));
    mesh.rotation.y = 0.25 - (i * 0.01);
    mesh.rotation.z = -0.18 + (i * 0.005);
    wing.add(mesh);
  }

  const root = new THREE.Object3D();
  root.add(wing);

  if (side === 'left') {
    root.position.set(- (size/2 - 0.1), 0, 0.09);
    root.rotation.y = -Math.PI / 12;
  } else if (side === 'right') {
    root.scale.x = -1;
    root.position.set(size/2 - 0.1, 0, 0.09);
    root.rotation.y = Math.PI / 12;
  }

  root.scale.multiplyScalar(0.95);
  return root;
}

const leftWing = makeWing('left');
cube.add(leftWing);
const rightWing = makeWing('right');
cube.add(rightWing);

// ---------- Clouds ----------
const loader = new THREE.TextureLoader();
const cloudTextures = [ loader.load('cloud1.png'), loader.load('cloud2.png') ];
const clouds = [];
function createClouds() {
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const baseCloudSize = maxDim * 0.025;
  const spawnRangeX = window.innerWidth * 0.06;
  const spawnRangeY = window.innerHeight * 0.06;
  clouds.forEach(c => scene.remove(c));
  clouds.length = 0;
  for (let i = 0; i < 70; i++) {
    const tex = cloudTextures[i % cloudTextures.length];
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent:true, opacity:0.8, side:THREE.DoubleSide, depthWrite:false });
    const scaleFactor = 0.8 + Math.random()*0.4;
    const cloudSize = baseCloudSize * scaleFactor;
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(cloudSize, cloudSize), mat);
    plane.position.set(Math.random()*spawnRangeX*2 - spawnRangeX, Math.random()*spawnRangeY*2 - spawnRangeY, Math.random()*-80 - 10);
    plane.userData.speed = 0.01 + Math.random()*0.015;
    scene.add(plane);
    clouds.push(plane);
  }
}
createClouds();

// ---------- Lights ----------
const pointLight = new THREE.PointLight(0xffffff, 1.3);
pointLight.position.set(3,3,6);
scene.add(pointLight);
const fillLight = new THREE.PointLight(0xff88ff, 0.8);
fillLight.position.set(-3,-2,-5);
scene.add(fillLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// ---------- Color Picker + Blink + Rotation ----------
let blink=0, blinking=false;
setInterval(()=>blinking=true, 2500);
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const colorInput = document.getElementById("colorPicker");
let activeFaceMaterialIndex = -1;

function getMaterialIndexFromFaceIndex(geom, faceIndex) {
  if (geom.groups && geom.groups.length) {
    for (let i=0;i<geom.groups.length;i++) {
      const g = geom.groups[i];
      const triStart = Math.floor(g.start/3);
      const triCount = Math.floor(g.count/3);
      if(faceIndex>=triStart && faceIndex<triStart+triCount) return g.materialIndex;
    }
  }
  return Math.floor(faceIndex/2);
}

function applyColor(e) {
  if(activeFaceMaterialIndex>=0){
    const col = new THREE.Color(e.target.value);
    col.offsetHSL(0,0,0.12);
    if(materials[activeFaceMaterialIndex]) materials[activeFaceMaterialIndex].color.set(col);
    else materials.forEach(m=>m.color.set(col));
    upperLid.material.color.set(col);
    lowerLid.material.color.set(col);
  }
}
colorInput.addEventListener('input', applyColor);
colorInput.addEventListener('change', applyColor);
colorInput.addEventListener('pointerdown', e=>e.stopPropagation());

// Manual rotation
let isPointerDown=false, dragStart={x:0,y:0}, lastPointer={x:0,y:0}, hasDragged=false;
const DRAG_THRESHOLD=6, vel={x:0,y:0}, FRICTION=0.92;
renderer.domElement.style.touchAction='none';

renderer.domElement.addEventListener('pointerdown', ev=>{
  isPointerDown=true; hasDragged=false; dragStart.x=ev.clientX; dragStart.y=ev.clientY;
  lastPointer.x=ev.clientX; lastPointer.y=ev.clientY;
});
window.addEventListener('pointermove', ev=>{
  if(!isPointerDown) return;
  const dx=ev.clientX-lastPointer.x, dy=ev.clientY-lastPointer.y;
  const totalDX=ev.clientX-dragStart.x, totalDY=ev.clientY-dragStart.y;
  if(Math.abs(totalDX)>DRAG_THRESHOLD||Math.abs(totalDY)>DRAG_THRESHOLD) hasDragged=true;
  if(hasDragged){
    const rotateSpeed=0.005;
    cube.rotation.y+=dx*rotateSpeed; cube.rotation.x+=dy*rotateSpeed;
    const maxX=Math.PI/2.2, minX=-Math.PI/2.2;
    cube.rotation.x=Math.max(minX,Math.min(maxX,cube.rotation.x));
    vel.x=dx*rotateSpeed; vel.y=dy*rotateSpeed;
  }
  lastPointer.x=ev.clientX; lastPointer.y=ev.clientY;
});
window.addEventListener('pointerup', ev=>{
  isPointerDown=false;
  const totalDX=ev.clientX-dragStart.x, totalDY=ev.clientY-dragStart.y;
  if(!hasDragged && Math.abs(totalDX)<DRAG_THRESHOLD && Math.abs(totalDY)<DRAG_THRESHOLD){
    mouse.x=(ev.clientX/window.innerWidth)*2-1;
    mouse.y=-(ev.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObject(cube,true);
    if(intersects.length){
      const hit=intersects[0];
      activeFaceMaterialIndex=getMaterialIndexFromFaceIndex(cube.geometry,hit.faceIndex);
      colorInput.style.left=`${ev.clientX-24}px`;
      colorInput.style.top=`${ev.clientY-20}px`;
      colorInput.style.display='block';
      colorInput.click();
    } else {
      colorInput.style.display='none'; activeFaceMaterialIndex=-1;
    }
  }
});

// ---------- Animate ----------
function animate(){
  requestAnimationFrame(animate);
  if(!isPointerDown){
    cube.rotation.y+=vel.x;
    cube.rotation.x+=vel.y;
    vel.x*=FRICTION; vel.y*=FRICTION;
    if(Math.abs(vel.x)<1e-4) vel.x=0;
    if(Math.abs(vel.y)<1e-4) vel.y=0;
  }
  if(blinking){
    blink+=0.25;
    eyeball.scale.y=Math.abs(Math.cos(blink));
    if(blink>Math.PI){ blink=0; blinking=false; eyeball.scale.y=1; }
  }
  const spawnRangeX=window.innerWidth*0.06;
  clouds.forEach(c=>{ c.position.x+=c.userData.speed; if(c.position.x>spawnRangeX) c.position.x=-spawnRangeX; });
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  createClouds();
});
</script>
</body>
</html>
